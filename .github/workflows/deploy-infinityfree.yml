name: Deploy SIPN to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy website files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Check PHP syntax
        run: |
          find SIPN -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Upload SIPN to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./SIPN/
          server-dir: /htdocs/SIPN/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/AKUN.md
            **/README.md
            **/Koneksi.php
            **/database/**
            **/*.zip
            **/uploads/profil/*.jpg
            **/uploads/profil/*.jpeg
            **/uploads/profil/*.png
            **/uploads/profil/*.webp
